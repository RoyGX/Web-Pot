{% extends "base.html" %}
{% block title %}Iniciar Sessió - Suport Intern{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="logo-icon mb-3">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold text-primary">Suport Intern</h3>
                    <p class="text-muted">Consell Comarcal del Tarragonès</p>
                </div>

                <form method="POST" action="{{ url_for('main.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="bi bi-person me-1"></i>Usuari
                        </label>
                        <input type="text" class="form-control form-control-lg" id="username"
                               name="username" placeholder="El teu nom d'usuari" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-key me-1"></i>Contrasenya
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password"
                               name="password" placeholder="La teva contrasenya" required>
                    </div>

                    <div class="mb-4">
                        <label for="mfa_token" class="form-label">
                            <i class="bi bi-phone me-1"></i>Token MFA
                        </label>
                        <input type="text" class="form-control form-control-lg" id="mfa_token"
                               name="mfa_token" placeholder="Token d'autenticació" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sessió
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

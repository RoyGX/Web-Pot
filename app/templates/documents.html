{% extends "base.html" %}
{% block title %}Documentació - Eina de gestió de RLT{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-10">
        <div class="card shadow border-0">
            <div class="card-body p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
                    <div>
                        <h3 class="fw-bold text-primary mb-1">
                            <i class="bi bi-file-earmark-pdf-fill me-2"></i>Documentació
                        </h3>
                        <p class="text-muted mb-0">Fitxa RLT — Guia de conscienciació (Simulacre RLT)</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="{{ url_for('main.inici') }}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left me-1"></i>Tornar a l'inici
                        </a>
                        <a href="{{ url_for('static', filename='docs/fitxa_rlt.pdf') }}" target="_blank" class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-box-arrow-up-right me-1"></i>Obrir en pestanya nova
                        </a>
                        <a href="{{ url_for('static', filename='docs/fitxa_rlt.pdf') }}" download="Fitxa RLT.pdf" class="btn btn-primary btn-sm">
                            <i class="bi bi-download me-1"></i>Descarregar PDF
                        </a>
                    </div>
                </div>

                <div class="border rounded overflow-hidden bg-light">
                    <iframe src="{{ url_for('static', filename='docs/fitxa_rlt.pdf') }}"
                            width="100%"
                            height="750px"
                            style="border: none; display: block;">
                        <p class="p-4 text-center">
                            El teu navegador no pot mostrar el PDF directament.
                            <a href="{{ url_for('static', filename='docs/fitxa_rlt.pdf') }}" download="Fitxa RLT.pdf">Fes clic aquí per descarregar-lo</a>.
                        </p>
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

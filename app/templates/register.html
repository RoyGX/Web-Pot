{% extends "base.html" %}
{% block title %}Crear Compte - Suport Intern{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="logo-icon mb-3">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold text-primary">Crear Compte</h3>
                    <p class="text-muted">Registra't al portal de suport</p>
                </div>

                <form method="POST" action="{{ url_for('main.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="bi bi-person me-1"></i>Usuari
                        </label>
                        <input type="text" class="form-control form-control-lg" id="username"
                               name="username" placeholder="Escull un nom d'usuari" required autofocus
                               value="{{ username|default('', true) }}">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-key me-1"></i>Contrasenya
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password"
                               name="password" placeholder="Mínim 6 caràcters" required minlength="6">
                    </div>

                    <div class="mb-4">
                        <label for="password_confirm" class="form-label">
                            <i class="bi bi-key-fill me-1"></i>Confirmar Contrasenya
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password_confirm"
                               name="password_confirm" placeholder="Repeteix la contrasenya" required>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 mb-3">
                        <i class="bi bi-check-circle me-2"></i>Crear Compte
                    </button>
                </form>

                <hr>

                <div class="text-center">
                    <p class="text-muted mb-1">Ja tens compte?</p>
                    <a href="{{ url_for('main.login') }}" class="btn btn-outline-primary">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sessió
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

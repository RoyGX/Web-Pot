services:
  web:
    build: .
    container_name: web-pot
    ports:
      - "5000:5000"
    volumes:
      - web_pot_data:/app/data
    environment:
      - SECRET_KEY=canvia-aquesta-clau-en-produccio
      - DATABASE_URL=sqlite:///data/users.db
    restart: unless-stopped

volumes:
  web_pot_data:
